<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Notely • Almost there</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" />

    <link rel="stylesheet" href="css/onboard.css">

    <link rel="stylesheet" href="css/theme.css">
    <script src="../services/theme.js"></script>

</head>

<body>

    <main class="screen">

        <!-- STEP 1 — welcome + role -->

        <section class="step" id="stepRole">

            <header class="header">

                <button
                    class="back-btn"
                    id="backToLogin"
                    aria-label="Back to login">

                    ←

                </button>

                <div class="app-logo">

                    N

                </div>

                <img
                    class="google-avatar hidden"
                    id="googlePic"
                    alt="">

                <h1 id="welcomeTitle">Welcome!</h1>

                <p id="welcomeSub">
                    Your Google account checks out. Just two tiny
                    details and your classroom is ready.
                </p>

            </header>

            <section class="cards">

                <button
                    class="card teacher"
                    data-role="teacher">

                    <div class="check">
                        ✓
                    </div>

                    <div class="image">

                        <img
                            src="../assets/images/teacher.png"
                            alt="Teacher">

                    </div>

                    <h2>Teacher</h2>
                    <p>Create your school &amp; share notes</p>

                </button>

                <button
                    class="card student"
                    data-role="student">

                    <div class="check">
                        ✓
                    </div>

                    <div class="image">

                        <img
                            src="../assets/images/student.png"
                            alt="Student">

                    </div>

                    <h2>Student</h2>
                    <p>Find every note, instantly</p>

                </button>

            </section>

            <p class="tiny-note">

                <span class="material-symbols-rounded">
                    auto_awesome
                </span>

                We'll pick a username for you — change it anytime in Profile.

            </p>

            <button
                id="continueBtn"
                disabled>

                Continue →

            </button>

        </section>

        <!-- STEP 2 — teacher school details -->

        <section class="step hidden" id="stepDetails">

            <header class="header">

                <button
                    class="back-btn"
                    id="backToRole"
                    aria-label="Back">

                    ←

                </button>

                <div class="app-logo">

                    N

                </div>

                <h1>One tiny step</h1>

                <p>
                    Tell us a little about your school — or skip it,
                    you can add this later in Profile.
                </p>

            </header>

            <form
                id="detailsForm"
                autocomplete="off">

                <div class="teacher-card">

                    <div class="teacher-header">

                        <h3>School Information</h3>

                        <label class="skip-school">

                            <input
                                type="checkbox"
                                id="skipSchool">

                            <span>
                                Skip for now
                            </span>

                        </label>

                    </div>

                    <div class="input-group">

                        <label>

                            School Name

                        </label>

                        <input
                            type="text"
                            id="schoolName"
                            placeholder="ABC Public School">

                    </div>

                    <div class="input-group">

                        <label>

                            Subjects You Teach

                        </label>

                        <input
                            type="text"
                            id="subjects"
                            placeholder="Math, Science">

                    </div>

                    <div class="input-group">

                        <label>

                            School Phone

                        </label>

                        <input
                            type="tel"
                            id="schoolPhone"
                            placeholder="+91 98765 43210">

                    </div>

                    <div class="input-group">

                        <label>

                            School Coordinator

                            <span>(Optional)</span>

                        </label>

                        <input
                            type="text"
                            id="coordinator"
                            placeholder="Leave empty if none">

                    </div>

                </div>

                <small id="onboardError" class="form-error"></small>

                <button
                    id="finishBtn"
                    type="submit">

                    Finish →

                </button>

            </form>

        </section>

    </main>

    <script src="../api/config.js"></script>
    <script src="../services/session.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/onboard.js"></script>

</body>

</html>
