<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Notely • Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" />

    <link
        rel="stylesheet"
        href="css/login.css">
    <link rel="stylesheet" href="css/shared.css">

    <link rel="stylesheet" href="css/theme.css">
    <script src="../services/theme.js"></script>
</head>

<body>

    <main class="screen">

        <!-- Header -->

        <header class="header">

            <div class="logo">

                N

            </div>

            <h1>

                Welcome Back

            </h1>

            <p>

                Sign in to continue your Notely journey.

            </p>

        </header>

        <!-- Login -->

        <form
            id="loginForm"
            autocomplete="off">

            <!-- Username -->

            <div class="input-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username">

            </div>

            <!-- Password -->

            <div class="input-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password">

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password">

                        <span
                            id="eyeIcon"
                            class="material-symbols-rounded">

                            visibility

                        </span>

                    </button>

                </div>

            </div>

            <!-- Email-not-verified transition notice -->

            <div class="auth-notice" id="authNotice">
                <span class="spinner"></span>
                <span id="authNoticeText">Email not verified — taking you to verification…</span>
            </div>

            <!-- Error -->

            <small id="loginError"></small>

            <!-- Forgot -->

            <div class="forgot-row">

                <button
                    type="button"
                    id="forgotBtn">

                    Forgot Password?

                </button>

            </div>

            <!-- Continue -->

            <button
                id="loginBtn"
                type="submit"
                disabled>

                Continue →

            </button>

        </form>

        <!-- Divider -->

        <div class="divider">

            <span>

                OR

            </span>

        </div>

        <!-- Register -->

        <div class="bottom-text">

            <p>

                Don't have an account?

            </p>

            <button
                id="createAccountBtn"
                type="button">

                Create one

            </button>

        </div>

        <!-- User Not Found -->

        <div
            class="suggest-register"
            id="registerSuggestion">

            <span class="material-symbols-rounded">

                person_add

            </span>

            <div>

                <h4>

                    New to Notely?

                </h4>

                <p>

                    We couldn't find this account.
                    Create one in less than a minute.

                </p>

            </div>

            <button
                id="quickRegisterBtn"
                type="button">

                Create

            </button>

        </div>

    </main>

    <script src="../api/config.js"></script>
    <script src="../services/session.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/login.js"></script>

</body>

</html>
