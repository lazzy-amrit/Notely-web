<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Notely • Create New Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">

    <link rel="stylesheet" href="css/new_password.css">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="../services/theme.js"></script>
</head>

<body>

    <main class="screen">

        <!-- Header -->

        <header class="header">

            <button
                class="back-btn"
                id="backBtn">

                ←

            </button>

            <div class="logo">

                N

            </div>

            <h1>

                Create New Password

            </h1>

            <p>

                Enter your new password. It must be different from your old one.

            </p>

        </header>

        <!-- Form -->

        <form
            id="newPasswordForm"
            autocomplete="off">

            <!-- New Password -->

            <div class="input-group">

                <label>

                    New password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create new password"
                        autocomplete="new-password">

                    <button
                        type="button"
                        id="toggleNewPassword"
                        aria-label="Show password">

                        <span
                            id="newEyeIcon"
                            class="material-symbols-rounded">

                            visibility

                        </span>

                    </button>

                </div>

            </div>

            <!-- Confirm Password -->

            <div class="input-group">

                <label>

                    Confirm password

                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Retype password"
                        autocomplete="new-password">

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        aria-label="Show password">

                        <span
                            id="confirmEyeIcon"
                            class="material-symbols-rounded">

                            visibility

                        </span>

                    </button>

                </div>

            </div>

            <small id="newPasswordError"></small>

            <button
                id="createBtn"
                type="submit"
                disabled>

                Create Password →

            </button>

        </form>

        <!-- Footer -->

        <div class="bottom-link">

            Remember your password?

            <a href="login.html">

                Login

            </a>

        </div>

    </main>

    <script src="../api/config.js"></script>
    <script src="../services/session.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/new_password.js"></script>

</body>

</html>
