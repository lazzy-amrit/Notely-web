<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Notely • Verify Code</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/reset_password.css">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="../services/theme.js"></script>
</head>

<body>

    <main class="screen">

        <!-- Header -->

        <header class="header">

            <button
                class="back-btn"
                id="backBtn">

                ←

            </button>

            <div class="logo">

                N

            </div>

            <h1>

                Verify Code

            </h1>

            <p>

                We've sent a 6-digit code to your email. Enter it to continue.

            </p>

            <h3 id="emailDisplay">

                @email

            </h3>

        </header>

        <!-- OTP -->

        <section class="otp-card">

            <div
                class="otp-boxes"
                id="otpBoxes">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

                <input
                    class="otp"
                    maxlength="1"
                    inputmode="numeric">

            </div>

            <small id="otpError"></small>

            <button
                id="verifyBtn"
                disabled>

                Verify Code

            </button>

        </section>

    </main>

    <script src="../api/config.js"></script>
    <script src="../services/session.js"></script>
    <script src="js/storage.js"></script>

    <script src="js/reset_password.js"></script>

</body>

</html>
