<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notely</title>
<!-- This is the logged-in app shell, not the public site — it requires
     a session and has no unique content of its own to rank on, so it's
     kept out of search results. The marketing/landing page (index.html)
     is what should be indexed. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/images/logo.png">
<link rel="apple-touch-icon" href="assets/images/logo.png">
<!-- Lets the site be added to a phone's home screen and open
     full-screen like an app. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7B61FF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101017">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0">

<!-- PDF.js: renders note PDFs onto <canvas> in the full-screen in-app
     viewer (utils/pdf-viewer.js). Loaded from a CDN since this project
     has no bundler; legacy build for broader Android WebView support. -->
<script defer src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>

<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/desktop.css">
<link rel="stylesheet" href="pages/notes/notes.css">
<link rel="stylesheet" href="pages/schools/schools.css">
<link rel="stylesheet" href="pages/profile/profile.css">
<link rel="stylesheet" href="pages/home/home.css">
</head>
<body>

<div id="app">
    <div id="app-content"></div>
    <div id="nav-root"></div>
</div>

<!-- Everything below theme.js can load in parallel (defer keeps the
     declared execution order) instead of one-blocking-the-next. theme.js
     itself stays synchronous so the palette is applied before first paint. -->
<script src="services/theme.js"></script>
<script defer src="api/config.js"></script>
<script defer src="utils/file-compression.js"></script>
<script defer src="services/session.js"></script>
<script defer src="services/cache.js"></script>
<script defer src="api/http.js"></script>
<script defer src="services/storage.js"></script>
<script defer src="api/auth.js"></script>
<script defer src="api/schools.js"></script>
<script defer src="api/classes.js"></script>
<script defer src="api/subjects.js"></script>
<script defer src="api/users.js"></script>
<script defer src="api/notes.js"></script>
<script defer src="api/stars.js"></script>

<script defer src="utils/dom.js"></script>
<script defer src="utils/optimistic.js"></script>
<script defer src="utils/images-to-pdf.js"></script>
<script defer src="utils/pdf-viewer.js"></script>
<script defer src="utils/format.js"></script>
<script defer src="utils/entity-cache.js"></script>

<script defer src="services/toast.js"></script>
<script defer src="services/sheet.js"></script>
<script defer src="services/router.js"></script>
<script defer src="services/membership.js"></script>

<script defer src="components/avatar.js"></script>
<script defer src="components/empty-state.js"></script>
<script defer src="components/confirm.js"></script>
<script defer src="components/tiny-menu.js"></script>
<script defer src="components/profile-preview.js"></script>
<script defer src="components/bottom-nav.js"></script>

<!-- Pages -->
<script defer src="pages/home/home.js"></script>
<script defer src="pages/notes/notes.js"></script>
<script defer src="pages/schools/subjects.js"></script>
<script defer src="pages/schools/schools.js"></script>
<script defer src="pages/profile/profile.js"></script>
<script defer src="pages/policies/policies.js"></script>

<script defer src="app.js"></script>

</body>
</html>
